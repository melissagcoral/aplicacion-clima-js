<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicación de Clima</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>


    <div class="container">
        <h1>Aplicación de Clima</h1>
        <input type="text" id="cityInput" placeholder="Ingrese una ciudad">
        <button id="searchButton" type="button">
            Buscar <i class="fas fa-search" alt="Buscar"></i> <!-- Icono de búsqueda -->
        </button>
        <button id="clear" type="button">
            Limpiar <i class="fas fa-trash-alt" alt="Limpiar"></i> <!-- Icono de limpiar -->
        </button>
        <div id="responseData"></div>
    </div>

    <script src="script.js"></script>

</body>

</html>
